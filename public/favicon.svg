<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The same chip as the wordmark: gold clay, six edge spots, and one
       red candle falling through the middle of it. -->
  <circle cx="20" cy="20" r="19" fill="#ffc247" />
  <g fill="#100a16">
    <rect x="17.5" y="0" width="5" height="6" rx="1" />
    <rect x="17.5" y="0" width="5" height="6" rx="1" transform="rotate(60 20 20)" />
    <rect x="17.5" y="0" width="5" height="6" rx="1" transform="rotate(120 20 20)" />
    <rect x="17.5" y="0" width="5" height="6" rx="1" transform="rotate(180 20 20)" />
    <rect x="17.5" y="0" width="5" height="6" rx="1" transform="rotate(240 20 20)" />
    <rect x="17.5" y="0" width="5" height="6" rx="1" transform="rotate(300 20 20)" />
  </g>
  <circle cx="20" cy="20" r="13.5" fill="#100a16" />
  <rect x="19" y="9" width="2" height="22" rx="1" fill="#ff4d5e" />
  <rect x="15.5" y="14" width="9" height="12" rx="1.5" fill="#ff4d5e" />
</svg>
